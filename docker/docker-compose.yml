services:
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:local
    build:
      context: ../xxl-job-admin
      dockerfile: Dockerfile
    container_name: xxl-job-admin
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Duser.timezone=Asia/Shanghai"
      LOG_HOME: /data/applogs
      # PostgreSQL is provided separately; these values match the current deployment.
      PARAMS: >-
        --spring.datasource.url=jdbc:postgresql://172.31.22.182:5432/postgres?currentSchema=xxl_job
        --spring.datasource.username=postgres.your-tenant-id
        --spring.datasource.password=replace_with_your_postgresql_password
        --spring.datasource.driver-class-name=org.postgresql.Driver
        --server.port=8080
        --server.servlet.context-path=/
    ports:
      - "2955:8080"
